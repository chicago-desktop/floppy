version: "1.0"
namespace: app
entries:
  - name: shots
    kind: fs.directory
    meta:
      comment: Where the window's shot goes.
    base: project
    directory: ./shots
    auto_init: true

  - name: system_fonts
    kind: fs.directory
    meta:
      comment: System TrueType fonts, read-only — the font arrives in gfx as bytes, not as a path.
    auto_init: false
    directory: /usr/share/fonts/truetype/liberation/

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database — the sample does not use it, but the shell's migrations ask for the resource.
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  # The shell's endpoint entries resolve against these at boot; no suite calls
  # them. The port is apart from the shell harness's :19229 and the other
  # modules' harnesses, so they can run side by side.
  - name: gateway
    kind: http.service
    addr: :19249
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive actor scope for the suites.
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # The harness tests the module, so it depends on it; the replacement in
  # .wippy.yaml substitutes the working copy from ../.
  - name: floppy_harness.dep.module
    version: "*"
    kind: ns.dependency
    meta:
      comment: The module under test; its source is replaced with ../ in .wippy.yaml.
    component: "chicago/floppy"

  - name: floppy_harness.dep.migration
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host binding for the migrations the shell brings.
    component: "wippy/migration"
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  - name: floppy_harness.dep.security
    version: "*"
    kind: ns.dependency
    meta:
      comment: Platform security groups that give host-managed services their policy scope under strict mode.
    component: "wippy/security"

  - name: floppy_harness.dep.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host wiring for the standalone test harness.
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage

  - name: disk_test
    kind: function.lua
    meta: {type: test, suite: chicago_floppy, group: Floppy}
    source: file://disk_test.lua
    method: run
    modules: [fs, gfx, registry, hub, uuid, funcs, tty, process, channel, time]
    imports:
      test: wippy.test:test
      window: chicago.floppy:window
      session: chicago.floppy:session
      model: chicago.floppy:model
      sources: chicago.shell.explorer:sources
      ui: chicago.shell.sdk:ui
      render: chicago.shell.sdk:render
      rasters: chicago.shell.theme:rasters
