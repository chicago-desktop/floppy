organization: chicago
module: floppy
description: Virtual floppy drive with a retro Setup Wizard and temporary executable WAPP mounts.
license: MIT
exclude_meta:
  type: [test]
# The harness owns app:* services and bindings; it is not part of the module.
exclude:
  - "test/**"
  - "test:**"
  - "app:**"
  - "app.env:**"
  - ".wippy/**"
  - "wippy.lock"

embed:
  - chicago.floppy:images
  - chicago.floppy:disks
