version: "1.0"
namespace: chicago.floppy.tips

# Discovered by Welcome; no dependency on Welcome is required.
entries:
  - name: insert
    kind: registry.entry
    meta:
      type: chicago.tip
      order: 200
      title: "Try a floppy disk"
    data:
      text: "Open My Computer and then 3½ Floppy (A:). Choose Ski under Included disks and click Insert Disk to read its label and README. To add your own WAPP, use Add Disks for instructions and My disks to select it. Opening the drive requires an administrator account."
      image: floppy
      open: chicago.floppy:window
  - name: run
    kind: registry.entry
    meta:
      type: chicago.tip
      order: 210
      title: "Run a program from a disk"
    data:
      text: "After inserting a compatible WAPP disk, click Setup and follow the wizard. The progress bar pauses at 99% for ten seconds. Click Finish, select a program, and click Run. Setup enables programs temporarily until you eject the disk."
      image: floppy
      open: chicago.floppy:window
  - name: eject
    kind: registry.entry
    meta:
      type: chicago.tip
      order: 220
      title: "Eject when you are done"
    data:
      text: "Click Eject to remove this disk\u2019s temporary programs and close the package. Closing the drive window normally does the same. Ejecting closes this disk’s game windows before removing its programs."
      image: floppy
      open: chicago.floppy:window
  - name: format
    kind: registry.entry
    meta:
      type: chicago.tip
      order: 230
      title: "Small programs, one disk"
    data:
      text: "Try Ski from ski.wapp: Left and Right steer, Space pauses, and R starts a new run. The game opens full-screen; Esc returns to the drive. The game lives on the disk, which must stay inserted. Agents can find the authoring guide in the readme of chicago.floppy:definition."
      image: floppy
      open: chicago.floppy:window
